services:
  # Queue service (RabbitMQ worker)
  queue:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/client.crt:/certs/client.crt:ro
      - ./certs/client.key:/certs/client.key:ro
      - ./src:/var/www/html
    command: ["/usr/local/bin/wait-for-rabbitmq.sh"]
    networks:
      - app-network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

# Empty volumes
volumes: {}

# External network
networks:
  app-network:
    external: true
